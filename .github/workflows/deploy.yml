name: Deploy to Render

on:
  push:
    branches: [main]

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy and wait for it to go live
        run: |
          deploy_id=""
          for attempt in $(seq 1 5); do
            response=$(curl --fail-with-body --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 4 \
              -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{}')
            deploy_id=$(python3 -c \
              "import json,sys; data=json.loads(sys.argv[1] or '{}'); print(data.get('id',''))" \
              "$response")
            if [ -n "$deploy_id" ]; then
              break
            fi
            echo "Render returned no deploy id (attempt $attempt/5); retrying..."
            sleep 15
          done
          if [ -z "$deploy_id" ]; then
            echo "::error::Render did not return a deploy id"
            exit 1
          fi
          echo "Deploy $deploy_id triggered, waiting for it to finish..."

          for i in $(seq 1 60); do
            response=$(curl --fail-with-body --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 4 \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$deploy_id" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")
            status=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['status'])" "$response")
            echo "status: $status"
            if [ "$status" = "live" ]; then
              break
            fi
            if [ "$status" = "build_failed" ] || [ "$status" = "update_failed" ] || [ "$status" = "canceled" ]; then
              echo "::error::Render deploy failed with status $status"
              exit 1
            fi
            sleep 10
          done

          if [ "$status" != "live" ]; then
            echo "::error::Render deploy did not go live within 10 minutes (last status: $status)"
            exit 1
          fi

      - name: Verify service responds
        run: |
          curl -f -s -o /dev/null "https://restaurant-ai-bot-n844.onrender.com/health" \
            || (echo "::error::Health check failed after deploy" && exit 1)
          echo "Health check passed."