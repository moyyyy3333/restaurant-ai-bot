name: Check Build Log

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PYTHON_VERSION is set
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/env-vars" \
            -o env-vars.json
          python3 - <<'PY'
          import json
          with open("env-vars.json") as f:
              data = json.load(f)
          for e in data:
              if e["envVar"]["key"] == "PYTHON_VERSION":
                  print("PYTHON_VERSION =", e["envVar"]["value"])
                  break
          else:
              print("PYTHON_VERSION not set")
          PY

      - name: Get latest deploy detail and app logs
        run: |
          deploy_id=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=1" \
            -o deploy.json; python3 -c "import json; print(json.load(open('deploy.json'))[0]['deploy']['id'])")
          echo "latest deploy: $deploy_id"

          curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$deploy_id" \
            | python3 -m json.tool

          owner=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/owners" -o owners.json; python3 -c "import json; print(json.load(open('owners.json'))[0]['owner']['id'])")
          echo "owner: $owner"

          curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/logs?ownerId=$owner&resource=${{ secrets.RENDER_SERVICE_ID }}&type=app&limit=100" \
            | python3 -m json.tool
