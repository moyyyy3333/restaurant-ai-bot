name: Check Render Disk Config

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for persistent disk
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}" \
            -o service.json

          python3 - <<'PY'
          import json
          with open("service.json") as f:
              d = json.load(f)
          print("service type:", d.get("type"))
          details = d.get("serviceDetails", {})
          disk = details.get("disk")
          print("has disk:", disk is not None)
          if disk:
              print("mount path:", disk.get("mountPath"))
              print("size gb:", disk.get("sizeGB"))
          print("plan:", details.get("plan"))
          print("num instances:", details.get("numInstances"))
          PY
